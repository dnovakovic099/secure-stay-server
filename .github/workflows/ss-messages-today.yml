name: SecureStay Messages Today

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Count SecureStay inbox messages sent per rep today
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          command_timeout: 5m
          script: |
            set -e
            cd /home/ec2-user/secure_stay/secure-stay-server
            node <<'NODE'
            require("dotenv").config();
            const mysql = require("mysql2/promise");
            (async () => {
              const c = await mysql.createConnection({
                host: process.env.DATABASE_URL,
                port: Number(process.env.DATABASE_PORT),
                user: process.env.DATABASE_USERNAME,
                password: process.env.DATABASE_PASSWORD,
                database: process.env.DATABASE_NAME,
              });
              const fmt = new Intl.DateTimeFormat("en-US", {
                timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
              });
              const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));
              const etDate = `${parts.year}-${parts.month}-${parts.day}`;
              const dayStart = new Date(`${etDate}T04:00:00.000Z`);
              console.log(`ET date: ${etDate}  windowStartUTC: ${dayStart.toISOString()}`);

              // Primary: attributed SecureStay sends (v2 inbox)
              const [byUser] = await c.query(
                `SELECT m.sentByUserId AS userId,
                        COALESCE(NULLIF(TRIM(m.sentByName), ''),
                                 CONCAT(COALESCE(u.firstName,''), ' ', COALESCE(u.lastName,'')),
                                 CONCAT('user ', m.sentByUserId)) AS name,
                        COUNT(*) AS messages,
                        COUNT(DISTINCT m.threadId) AS threads
                 FROM inbox_messages m
                 LEFT JOIN users u ON u.id = m.sentByUserId
                 WHERE m.direction = 'outgoing'
                   AND m.sentByUserId IS NOT NULL
                   AND m.sentAt >= ?
                   AND (m.isAutomatic IS NULL OR m.isAutomatic = 0)
                 GROUP BY m.sentByUserId, name
                 ORDER BY messages DESC`,
                [dayStart]
              );

              // Also show unattributed outgoing (channel sync / auto / pre-attribution)
              const [[unattr]] = await c.query(
                `SELECT COUNT(*) AS messages, COUNT(DISTINCT threadId) AS threads
                 FROM inbox_messages
                 WHERE direction = 'outgoing'
                   AND sentByUserId IS NULL
                   AND sentAt >= ?
                   AND (isAutomatic IS NULL OR isAutomatic = 0)`,
                [dayStart]
              );
              const [[auto]] = await c.query(
                `SELECT COUNT(*) AS messages
                 FROM inbox_messages
                 WHERE direction = 'outgoing' AND sentAt >= ? AND isAutomatic = 1`,
                [dayStart]
              );

              console.log(`\n========== SecureStay inbox messages sent today ==========`);
              console.log(`Attributed to a rep: ${byUser.reduce((a,r)=>a+Number(r.messages),0)} messages across ${byUser.length} reps`);
              console.log(`Unattributed outgoing (no sentByUserId): ${unattr.messages} msgs / ${unattr.threads} threads`);
              console.log(`Automatic outgoing: ${auto.messages}`);
              console.log(`\nPer rep (messages | distinct threads):`);
              for (const r of byUser) {
                console.log(`  ${String(r.name).trim()}: ${r.messages} msgs | ${r.threads} threads`);
              }

              // Hourly shape for top senders
              if (byUser.length) {
                const topIds = byUser.slice(0, 8).map(r => r.userId);
                const ph = topIds.map(()=>'?').join(',');
                const [hourly] = await c.query(
                  `SELECT m.sentByUserId AS userId,
                          HOUR(CONVERT_TZ(m.sentAt, '+00:00', 'America/New_York')) AS hr,
                          COUNT(*) AS n
                   FROM inbox_messages m
                   WHERE m.direction='outgoing' AND m.sentByUserId IN (${ph})
                     AND m.sentAt >= ? AND (m.isAutomatic IS NULL OR m.isAutomatic=0)
                   GROUP BY userId, hr
                   ORDER BY userId, hr`,
                  [...topIds, dayStart]
                ).catch(async () => {
                  // tz tables missing — approximate with UTC-4
                  return c.query(
                    `SELECT m.sentByUserId AS userId,
                            HOUR(DATE_SUB(m.sentAt, INTERVAL 4 HOUR)) AS hr,
                            COUNT(*) AS n
                     FROM inbox_messages m
                     WHERE m.direction='outgoing' AND m.sentByUserId IN (${ph})
                       AND m.sentAt >= ? AND (m.isAutomatic IS NULL OR m.isAutomatic=0)
                     GROUP BY userId, hr
                     ORDER BY userId, hr`,
                    [...topIds, dayStart]
                  );
                });
                // skip dumping hourly unless useful — keep summary tight
              }

              await c.end();
            })().catch(e => { console.error(e); process.exit(1); });
            NODE
