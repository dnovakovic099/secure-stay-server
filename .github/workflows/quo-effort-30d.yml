name: Quo Effort 30d

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate Quo calls/texts last 30 days per employee per day
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/ec2-user/secure_stay/secure-stay-server
            node <<'NODE'
            require("dotenv").config();
            const mysql = require("mysql2/promise");
            const fs = require("fs");
            (async () => {
              const c = await mysql.createConnection({
                host: process.env.DATABASE_URL,
                port: Number(process.env.DATABASE_PORT),
                user: process.env.DATABASE_USERNAME,
                password: process.env.DATABASE_PASSWORD,
                database: process.env.DATABASE_NAME,
              });

              const [[msgRange]] = await c.query(`SELECT MIN(sentAt) mn, MAX(sentAt) mx, COUNT(*) n FROM quo_messages`);
              const [[callRange]] = await c.query(`SELECT MIN(occurredAt) mn, MAX(occurredAt) mx, COUNT(*) n FROM quo_calls`);
              console.log("MSG_RANGE n=" + msgRange.n + " min=" + msgRange.mn + " max=" + msgRange.mx);
              console.log("CALL_RANGE n=" + callRange.n + " min=" + callRange.mn + " max=" + callRange.mx);

              // Quo users from API if key present
              const key = process.env.QUO_API_KEY || process.env.OPENPHONE_API_KEY;
              let quoUsers = new Map();
              if (key) {
                const axios = require("axios");
                const res = await axios.get("https://api.openphone.com/v1/users", {
                  headers: { Authorization: key },
                  params: { maxResults: 100 },
                });
                for (const u of res.data?.data || []) {
                  const email = String(u.email || "").toLowerCase();
                  const name = [u.firstName, u.lastName].filter(Boolean).join(" ") || u.email || u.id;
                  quoUsers.set(u.id, { email, name, id: u.id });
                }
                console.log("QUO_USERS=" + quoUsers.size);
              } else {
                console.log("NO_QUO_API_KEY_ON_PROD");
              }

              // SS users by id for sentByUserId on messages
              const [ssUsers] = await c.query(`SELECT id, firstName, lastName, email FROM users WHERE deletedAt IS NULL`);
              const ssById = new Map(ssUsers.map(u => [Number(u.id), {
                name: [u.firstName, u.lastName].filter(Boolean).join(" ") || u.email,
                email: String(u.email||"").toLowerCase(),
              }]));

              const since = new Date(Date.now() - 30 * 86400000);
              // day key in ET
              const dayKey = (d) => {
                const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year:"numeric", month:"2-digit", day:"2-digit" });
                return fmt.format(new Date(d)); // YYYY-MM-DD
              };

              const cells = new Map(); // email|day -> stats
              const ensure = (email, name, day) => {
                const k = email + "|" + day;
                if (!cells.has(k)) cells.set(k, { email, name, day, calls:0, outCalls:0, inCalls:0, talkSec:0, texts:0 });
                const cell = cells.get(k);
                if (name && name.length > (cell.name||"").length) cell.name = name;
                return cell;
              };

              const exclude = (name, email) => {
                const s = (name + " " + email).toLowerCase();
                return /\bferdy\b/.test(s) || /\banj\b/.test(s) || /angelica/.test(s) || /\baya\b/.test(s) || /chua/.test(s);
              };

              // Messages outgoing
              const [msgs] = await c.query(
                `SELECT quoUserId, sentByUserId, senderName, sentAt FROM quo_messages
                 WHERE direction='outgoing' AND sentAt >= ?`,
                [since]
              );
              for (const m of msgs) {
                let email=null, name=null;
                if (m.sentByUserId && ssById.has(Number(m.sentByUserId))) {
                  ({email, name} = ssById.get(Number(m.sentByUserId)));
                } else if (m.quoUserId && quoUsers.has(m.quoUserId)) {
                  ({email, name} = quoUsers.get(m.quoUserId));
                } else if (m.senderName) {
                  name = m.senderName;
                  email = "name:" + m.senderName.toLowerCase();
                }
                if (!email || exclude(name||"", email)) continue;
                ensure(email, name, dayKey(m.sentAt)).texts++;
              }

              const [calls] = await c.query(
                `SELECT direction, duration, answeredBy, initiatedBy, quoUserId, occurredAt FROM quo_calls
                 WHERE occurredAt >= ?`,
                [since]
              );
              for (const call of calls) {
                const quoUid = call.direction === "outgoing" ? (call.initiatedBy || call.quoUserId) : call.answeredBy;
                if (!quoUid || !quoUsers.has(quoUid)) continue;
                const u = quoUsers.get(quoUid);
                if (exclude(u.name, u.email)) continue;
                const cell = ensure(u.email, u.name, dayKey(call.occurredAt));
                cell.calls++;
                if (call.direction === "outgoing") cell.outCalls++; else cell.inCalls++;
                cell.talkSec += Number(call.duration||0);
              }

              // Grade function (effort /10)
              const grade = (c) => {
                const talkMin = c.talkSec / 60;
                // Rough effort score: texts*0.04 + calls*0.25 + talkMin*0.08, cap 10
                // Calibrated so Rain-like day (~40 calls, 90 talk, 100 texts) ≈ 9
                const raw = c.texts * 0.035 + c.calls * 0.22 + talkMin * 0.07;
                return Math.max(0, Math.min(10, Math.round(raw * 10) / 10));
              };

              const rows = [...cells.values()].map(c => ({
                ...c,
                talkMin: Math.round(c.talkSec/60),
                grade: grade(c),
              })).sort((a,b) => a.day.localeCompare(b.day) || b.grade - a.grade);

              // Write JSON summary to stdout in chunks
              console.log("CELL_COUNT=" + rows.length);
              console.log("JSON_BEGIN");
              // Keep under log limits — emit compact lines
              for (const r of rows) {
                console.log(["D", r.day, r.name.replace(/\|/g,"/"), r.calls, r.outCalls, r.inCalls, r.talkMin, r.texts, r.grade].join("|"));
              }
              console.log("JSON_END");

              // Per-person averages
              const byPerson = new Map();
              for (const r of rows) {
                if (!byPerson.has(r.email)) byPerson.set(r.email, { name: r.name, days:0, gradeSum:0, calls:0, texts:0, talk:0 });
                const p = byPerson.get(r.email);
                p.days++; p.gradeSum += r.grade; p.calls += r.calls; p.texts += r.texts; p.talk += r.talkMin;
                if (r.name.length > p.name.length) p.name = r.name;
              }
              console.log("SUMMARY_BEGIN");
              [...byPerson.values()]
                .map(p => ({...p, avg: Math.round((p.gradeSum/p.days)*10)/10}))
                .sort((a,b) => b.avg - a.avg)
                .forEach(p => console.log(["S", p.name, p.days, p.avg, p.calls, p.texts, p.talk].join("|")));
              console.log("SUMMARY_END");

              await c.end();
            })().catch(e => { console.error(e); process.exit(1); });
            NODE
