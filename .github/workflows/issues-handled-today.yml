name: Issues Handled Today

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Count issues handled today by Jerome and Reyan
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          command_timeout: 5m
          script: |
            set -e
            cd /home/ec2-user/secure_stay/secure-stay-server
            node <<'NODE'
            require("dotenv").config();
            const mysql = require("mysql2/promise");
            (async () => {
              const c = await mysql.createConnection({
                host: process.env.DATABASE_URL,
                port: Number(process.env.DATABASE_PORT),
                user: process.env.DATABASE_USERNAME,
                password: process.env.DATABASE_PASSWORD,
                database: process.env.DATABASE_NAME,
              });
              const fmt = new Intl.DateTimeFormat("en-US", {
                timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
              });
              const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));
              const etDate = `${parts.year}-${parts.month}-${parts.day}`;
              const dayStart = new Date(`${etDate}T04:00:00.000Z`);
              console.log(`ET date: ${etDate}  windowStartUTC: ${dayStart.toISOString()}`);

              const [users] = await c.query(
                `SELECT u.id, u.uid, u.firstName, u.lastName, u.email
                 FROM users u
                 WHERE u.deletedAt IS NULL
                   AND (
                     (LOWER(u.firstName) LIKE 'jerome%' AND LOWER(u.lastName) LIKE 'chan%')
                     OR LOWER(u.firstName) LIKE 'reyan%'
                     OR LOWER(CONCAT(u.firstName,' ',u.lastName)) LIKE '%reyan%callao%'
                     OR LOWER(CONCAT(u.firstName,' ',u.lastName)) LIKE '%jerome%chan%'
                   )`
              );
              console.log("Matched users:");
              for (const u of users) {
                console.log(`  id=${u.id} uid=${u.uid} name=${[u.firstName,u.lastName].filter(Boolean).join(' ')} email=${u.email||''}`);
              }

              const jerome = users.filter(u => /jerome/i.test(`${u.firstName} ${u.lastName}`));
              const reyan = users.filter(u => /reyan/i.test(`${u.firstName} ${u.lastName}`));

              async function report(label, person) {
                if (!person.length) { console.log(`\n${label}: NO USER MATCH`); return; }
                const uids = [...new Set(person.map(p => p.uid).filter(Boolean))];
                const names = person.map(p => [p.firstName,p.lastName].filter(Boolean).join(' '));
                const display = names.join(' / ');
                console.log(`\n========== ${label} (${display}) ==========`);
                console.log(`  uids: ${uids.join(', ')}`);

                const ph = uids.map(() => '?').join(',');
                const [upd] = await c.query(
                  `SELECT COUNT(DISTINCT issueId) AS issues, COUNT(*) AS updates
                   FROM issues_updates
                   WHERE deletedAt IS NULL AND createdAt >= ?
                     AND createdBy IN (${ph})`,
                  [dayStart, ...uids]
                );

                const [completed] = await c.query(
                  `SELECT
                     SUM(CASE WHEN completed_at >= ? AND completed_by IN (${ph}) THEN 1 ELSE 0 END) AS ir_completed,
                     SUM(CASE WHEN gr_completed_at >= ? AND gr_completed_by IN (${ph}) THEN 1 ELSE 0 END) AS gr_completed,
                     COUNT(DISTINCT CASE
                       WHEN (completed_at >= ? AND completed_by IN (${ph}))
                         OR (gr_completed_at >= ? AND gr_completed_by IN (${ph}))
                       THEN id END) AS tickets_completed
                   FROM issues
                   WHERE deleted_at IS NULL`,
                  [dayStart, ...uids, dayStart, ...uids, dayStart, ...uids, dayStart, ...uids]
                );

                // Also match completed_by by display name (sometimes stored as name)
                const namePh = names.map(() => '?').join(',');
                const [completedByName] = names.length ? await c.query(
                  `SELECT COUNT(DISTINCT id) AS n
                   FROM issues
                   WHERE deleted_at IS NULL
                     AND (
                       (completed_at >= ? AND completed_by IN (${namePh}))
                       OR (gr_completed_at >= ? AND gr_completed_by IN (${namePh}))
                     )`,
                  [dayStart, ...names, dayStart, ...names]
                ) : [[{n:0}]];

                const [assigned] = await c.query(
                  `SELECT COUNT(*) AS n FROM issues
                   WHERE deleted_at IS NULL
                     AND assignee IN (${ph})
                     AND (status IS NULL OR LOWER(status) NOT IN ('completed','closed','resolved','done'))`,
                  [...uids]
                );

                const [sample] = await c.query(
                  `SELECT DISTINCT u.issueId, i.ai_short_title, i.issue_description, i.status, i.category
                   FROM issues_updates u
                   LEFT JOIN issues i ON i.id = u.issueId
                   WHERE u.deletedAt IS NULL AND u.createdAt >= ? AND u.createdBy IN (${ph})
                   ORDER BY u.issueId DESC
                   LIMIT 25`,
                  [dayStart, ...uids]
                );

                // updated_by / last touch on issues table today
                const [lastTouched] = await c.query(
                  `SELECT COUNT(*) AS n FROM issues
                   WHERE deleted_at IS NULL AND updated_at >= ?
                     AND (updated_by IN (${ph}) OR updated_by IN (${namePh || "''"}))`,
                  [dayStart, ...uids, ...(names.length ? names : [''])]
                ).catch(() => [[{n:0}]]);

                console.log(`  Issues with timeline update today: ${upd[0].issues}  (${upd[0].updates} update rows)`);
                console.log(`  Completed today by uid: ${completed[0].tickets_completed} (IR=${completed[0].ir_completed}, GR=${completed[0].gr_completed})`);
                console.log(`  Completed today by name: ${completedByName[0].n}`);
                console.log(`  Issues last-updated by them today: ${lastTouched[0].n}`);
                console.log(`  Currently assigned open: ${assigned[0].n}`);
                console.log(`  Tickets touched (sample up to 25):`);
                for (const r of sample) {
                  const t = r.ai_short_title || r.issue_description || '';
                  console.log(`    #${r.issueId} [${r.status||'?'}] ${String(t).slice(0,70)}`);
                }
              }

              await report('JEROME', jerome);
              await report('REYAN/RAIN', reyan);
              await c.end();
            })().catch(e => { console.error(e); process.exit(1); });
            NODE
