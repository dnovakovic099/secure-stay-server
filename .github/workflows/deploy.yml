name: Deploy Server to Production

concurrency:
  group: server-deployment-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - dev-new

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy secure-stay-server to EC2
        uses: appleboy/ssh-action@v1
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_REDIRECT_URI: ${{ secrets.REDDIT_REDIRECT_URI }}
          ASSISTANT_ENABLED: ${{ secrets.ASSISTANT_ENABLED }}
          ASSISTANT_PILOT_EMAILS: ${{ secrets.ASSISTANT_PILOT_EMAILS }}
          SEAM_API_KEY: ${{ secrets.SEAM_API_KEY }}
          SIFELY_CLIENT_ID: ${{ secrets.SIFELY_CLIENT_ID }}
          SIFELY_API_KEY: ${{ secrets.SIFELY_API_KEY }}
          SIFELY_USERNAME: ${{ secrets.SIFELY_USERNAME }}
          SIFELY_PASSWORD: ${{ secrets.SIFELY_PASSWORD }}
          SCIENER_CLIENT_ID: ${{ secrets.SCIENER_CLIENT_ID }}
          SCIENER_CLIENT_SECRET: ${{ secrets.SCIENER_CLIENT_SECRET }}
          TTLOCK_ACCOUNTS_JSON: ${{ secrets.TTLOCK_ACCOUNTS_JSON }}
          SCHLAGE_ACCOUNTS_JSON: ${{ secrets.SCHLAGE_ACCOUNTS_JSON }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          command_timeout: 40m
          # ssh-action only forwards variables named here — adding one to env:
          # above without listing it makes it silently empty on the box.
          envs: REDDIT_CLIENT_ID,REDDIT_CLIENT_SECRET,REDDIT_REDIRECT_URI,ASSISTANT_ENABLED,ASSISTANT_PILOT_EMAILS,SEAM_API_KEY,SIFELY_CLIENT_ID,SIFELY_API_KEY,SIFELY_USERNAME,SIFELY_PASSWORD,SCIENER_CLIENT_ID,SCIENER_CLIENT_SECRET,TTLOCK_ACCOUNTS_JSON,SCHLAGE_ACCOUNTS_JSON
          script: |
            set -e

            echo "========== Deploying secure-stay-server =========="
            cd /home/ec2-user/secure_stay/secure-stay-server || { echo "❌ Failed to change directory"; exit 1; }

            echo ">>> Syncing to origin/dev-new..."
            git fetch origin dev-new || { echo "❌ Git fetch failed"; exit 1; }
            # EC2 sometimes has leftover untracked scripts from prior smoke runs that
            # block pull/merge when the same path later lands in the repo.
            git clean -fd scripts/ || true
            git reset --hard origin/dev-new || { echo "❌ Git reset to origin/dev-new failed"; exit 1; }

            # Drop any existing line for this key, then append. The previous
            # implementation rewrote the value with `awk -v`, which processes
            # escape sequences: a secret containing a backslash was written
            # correctly on first deploy (printf path) and silently corrupted on
            # every deploy after (awk path). printf is used on both paths now so
            # values are stored verbatim.
            upsert_env() {
              key="$1"
              value="$2"
              if [ -f .env ]; then
                grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
                mv .env.tmp .env
              fi
              printf '%s=%s\n' "$key" "$value" >> .env
            }

            # Assistant rollout. Code defaults to OFF, so the widget only appears
            # once this is set; keeping it in a secret means it survives deploys
            # without anyone hand-editing .env on the box.
            if [ -n "${ASSISTANT_ENABLED:-}" ]; then
              echo ">>> Setting ASSISTANT_ENABLED=$ASSISTANT_ENABLED"
              upsert_env ASSISTANT_ENABLED "$ASSISTANT_ENABLED"
            fi
            if [ -n "${ASSISTANT_PILOT_EMAILS:-}" ]; then
              echo ">>> Setting ASSISTANT_PILOT_EMAILS"
              upsert_env ASSISTANT_PILOT_EMAILS "$ASSISTANT_PILOT_EMAILS"
            fi

            # Smart lock credentials. These program physical doors, so they must
            # come from GitHub secrets rather than a hand-edited .env — the
            # `git reset --hard` above destroys anything typed in by hand, which
            # is why lock automation kept silently reverting to unconfigured.
            # Each is upserted independently: a missing Seam key must not stop
            # Sifely locks from working, and vice versa.
            for lock_var in SEAM_API_KEY SIFELY_CLIENT_ID SIFELY_API_KEY SIFELY_USERNAME SIFELY_PASSWORD SCIENER_CLIENT_ID SCIENER_CLIENT_SECRET TTLOCK_ACCOUNTS_JSON SCHLAGE_ACCOUNTS_JSON; do
              eval "lock_val=\${$lock_var:-}"
              if [ -n "$lock_val" ]; then
                echo ">>> Setting $lock_var"
                upsert_env "$lock_var" "$lock_val"
              else
                echo "⚠️  $lock_var not set in GitHub secrets — locks using it will report 'Not set up'"
              fi
            done

            echo ">>> Ensuring Schlage Python bridge dependency (pyschlage)..."
            if ! python3 -m pip --version >/dev/null 2>&1; then
              python3 -m ensurepip --user >/dev/null 2>&1 || true
            fi
            if python3 -m pip --version >/dev/null 2>&1; then
              python3 -m pip install --user --quiet pyschlage || echo "⚠️ pip install pyschlage failed (Schlage sync will report errors until fixed)"
            else
              echo "⚠️ python3 pip unavailable - Schlage bridge cannot install pyschlage"
            fi

            if [ -n "$REDDIT_CLIENT_ID" ] && [ -n "$REDDIT_CLIENT_SECRET" ]; then
              echo ">>> Upserting Reddit OAuth env vars..."
              REDIRECT_URI="${REDDIT_REDIRECT_URI:-https://securestay.ai/securestay_api/oauth/reddit/callback}"
              upsert_env REDDIT_CLIENT_ID "$REDDIT_CLIENT_ID"
              upsert_env REDDIT_CLIENT_SECRET "$REDDIT_CLIENT_SECRET"
              upsert_env REDDIT_REDIRECT_URI "$REDIRECT_URI"
              upsert_env REDDIT_USER_AGENT "SecureStay/1.0"
              upsert_env REDDIT_OAUTH_SCOPES "adsread,adsedit,adsconversions"
              upsert_env REDDIT_PIXEL_ID "a2_ih4m3qbk6tej"
              upsert_env REDDIT_CAPI_TEST_MODE "false"
              upsert_env LANDING_LEAD_EMAIL "admin@luxurylodgingpm.com,operations@luxurylodgingpm.com"
              if [ -n "${ZAPIER_REDDIT_LEADS_WEBHOOK_URL:-}" ]; then
                upsert_env ZAPIER_REDDIT_LEADS_WEBHOOK_URL "$ZAPIER_REDDIT_LEADS_WEBHOOK_URL"
              fi
              echo ">>> Reddit OAuth env vars upserted"
            else
              echo ">>> Reddit OAuth secrets not set in GitHub; skipping env upsert"
            fi

            echo ">>> Installing dependencies..."
            npm install || { echo "❌ npm install failed"; exit 1; }

            echo ">>> Cleaning previous build output..."
            rm -rf dist/out-tsc

            echo ">>> Building the project..."
            npm run build || { echo "❌ Build failed"; exit 1; }

            if [ ! -f dist/out-tsc/app.js ]; then
              echo "❌ Build did not emit dist/out-tsc/app.js (wrong outDir layout?)"
              exit 1
            fi
            if [ -d dist/out-tsc/src ]; then
              echo "❌ Build emitted dist/out-tsc/src/ — tsconfig rootDir/include is wrong"
              exit 1
            fi

            echo ">>> Running database migrations..."
            npm run migrate || { echo "❌ Migration failed"; exit 1; }

            echo ">>> Seeding IR portfolio defaults + scraped vendor memory (best-effort)..."
            # mysql2-only scripts (no TypeORM/subscribers/Redis) so deploy cannot hang.
            timeout 60 npx ts-node src/scripts/seedIrPortfolioDefaults.ts || echo "⚠️ IR portfolio defaults seed failed/timed out (non-fatal)"
            timeout 120 npx ts-node src/scripts/seedIrVendorScrape.ts || echo "⚠️ IR vendor scrape seed failed/timed out (non-fatal)"

            echo ">>> Deep IR quality audit (force-suggest sample)..."
            timeout 90 npx ts-node src/scripts/auditIrDeepLive.ts || echo "⚠️ deep DB audit flagged issues (non-fatal)"
            if [ -f dist/out-tsc/scripts/auditIrDeepLive.js ]; then
              NODE_ENV=production timeout 600 node dist/out-tsc/scripts/auditIrDeepLive.js --force-suggest || echo "⚠️ deep force-suggest audit flagged issues (non-fatal)"
            elif [ -f dist/out-tsc/src/scripts/auditIrDeepLive.js ]; then
              NODE_ENV=production timeout 600 node dist/out-tsc/src/scripts/auditIrDeepLive.js --force-suggest || echo "⚠️ deep force-suggest audit flagged issues (non-fatal)"
            fi

            echo ">>> Pruning dev dependencies to reclaim disk..."
            npm prune --omit=dev || { echo "❌ npm prune failed"; exit 1; }

            echo ">>> Zero-downtime reload using ecosystem.config.js..."
            pm2 reload ecosystem.config.js || { echo "❌ PM2 reload failed"; exit 1; }

            echo ">>> Saving PM2 process list..."
            pm2 save || { echo "❌ PM2 save failed"; exit 1; }

            echo ">>> Syncing Reddit ad creatives into public/..."
            mkdir -p public/reddit-ads
            if [ -d assets/reddit-ads ]; then
              cp -f assets/reddit-ads/*.png public/reddit-ads/ 2>/dev/null || true
            fi

            if grep -q '^REDDIT_REFRESH_TOKEN=.' .env 2>/dev/null && [ ! -f public/reddit-ads/last-create-summary.json ]; then
              echo ">>> Creating paused Reddit lead forms + ads (one-time)..."
              python3 scripts/createRedditLeadAds.py || { echo "⚠️ Reddit ad creation failed (non-fatal for deploy)"; }
            else
              echo ">>> Skipping Reddit ad creation (no refresh token yet, or already created)"
            fi

            if grep -q '^REDDIT_REFRESH_TOKEN=.' .env 2>/dev/null && [ -f scripts/verifyRedditLeadAds.py ]; then
              echo ">>> Verifying Reddit lead ads setup..."
              python3 scripts/verifyRedditLeadAds.py || { echo "⚠️ Reddit ad verification reported issues"; }
            fi

            echo "========== Deployment complete =========="
            pm2 list
